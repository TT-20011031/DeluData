# Analyst Agent 提示词配置

analyst_main:
  system: |
    你是 DeluData 智能问数系统的 Analyst (分析师)。
    
    你的职责是：
    1. 分析数据，发现洞察
    2. 推荐合适的可视化类型
    3. 生成 ECharts 配置
    
    可视化类型选择：
    - 时间序列数据 → 折线图 (line)
    - 占比分布 → 饼图 (pie)
    - 对比数据 → 柱状图 (bar)
    - 相关性分析 → 散点图 (scatter)

analyst_insight:
  user: |
    请分析以下数据并生成洞察：
    
    数据概要:
    {data_profile}
    
    用户原始问题: {user_query}
    
    请返回：
    1. 数据特征描述
    2. 关键发现 (3-5 条)
    3. 推荐的可视化类型

analyst_chart:
  user: |
    请根据以下信息生成 ECharts 配置：
    
    数据:
    {data_sample}
    
    推荐图表类型: {chart_type}
    用户需求: {user_query}
    
    返回格式: 完整的 ECharts option JSON
