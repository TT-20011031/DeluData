server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 添加 .mjs 文件支持
    location ~* \.mjs$ {
        types {
            application/javascript mjs;
        }
        default_type application/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
