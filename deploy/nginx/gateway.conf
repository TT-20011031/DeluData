# 保留外层代理传递的 X-Forwarded-Proto，避免被 HTTP 覆盖
map $http_x_forwarded_proto $proxy_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

upstream admin_backend {
    server admin-backend:8000;
}

upstream experience_backend {
    server experience-backend:8001;
}

upstream admin_frontend {
    server frontend-admin:80;
}

upstream experience_frontend {
    server frontend-experience:80;
}

upstream platform_frontend {
    server frontend-platform:80;
}

upstream knowledge_mcp {
    server knowledge-mcp:8020;
}

server {
    listen 8020;
    server_name _;

    # Docker DNS resolver - refresh every 10s to avoid stale IP cache
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 100m;

    location /api/experience/ {
        proxy_pass http://experience_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://experience_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
    }

    location = /api/health {
        proxy_pass http://experience_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
    }

    location / {
        proxy_pass http://experience_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
    }
}

server {
    listen 8021;
    server_name _;

    # Docker DNS resolver - refresh every 10s to avoid stale IP cache
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://admin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location /mcp/deludata-knowledge/ {
        proxy_pass http://knowledge_mcp/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }

    location = /health {
        proxy_pass http://admin_backend/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
    }

    location = /platform {
        return 301 /platform/;
    }

    location /platform/ {
        proxy_pass http://platform_frontend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
    }

    location / {
        proxy_pass http://admin_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
    }
}

